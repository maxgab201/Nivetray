name: Windows portable
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      draft_release:
        description: 'Create a draft release for this existing version tag (requires explicit maintainer approval)'
        type: boolean
        default: false

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build Nivetray.sln -c Release
      - name: Test safety and preferences
        run: dotnet run --project tests/Nivetray.Tests -c Release --no-build
      - name: Verify version for tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props
          if ($env:GITHUB_REF_NAME -ne ('v' + $props.Project.PropertyGroup.Version)) { throw 'Tag does not match project version' }
      - name: Build and verify portable package
        shell: pwsh
        run: ./scripts/BuildPortable.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: Nivetray-${{ matrix.runtime }}
          path: |
            artifacts/*.zip
            artifacts/*.sha256
          if-no-files-found: error
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.draft_release && startsWith(github.ref, 'refs/tags/v')
    needs: portable
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Nivetray-*
          path: release
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes --title "Nivetray $GITHUB_REF_NAME"
